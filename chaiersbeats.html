<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chaiers Beats | Premium Music Experience</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff4757;
            --primary-glow: rgba(255, 71, 87, 0.3);
            --bg: #0a0a0b;
            --sidebar-bg: #141417;
            --card-bg: #1c1c21;
            --text: #ffffff;
            --text-dim: #a0a0a0;
            --accent: #2ed573;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* --- Header --- */
        header {
            padding: 25px 40px;
            background: rgba(15, 15, 15, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 { 
            margin: 0; 
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(45deg, var(--primary), #ff6b81);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 1.5rem;
        }

        header p { margin: 0; color: var(--text-dim); font-size: 0.9rem; }

        /* --- Layout --- */
        .main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .container {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        /* --- Playlist Section --- */
        .playlist-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .track-list {
            display: grid;
            gap: 10px;
        }

        .track-item {
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: var(--transition);
            border: 1px solid transparent;
            cursor: pointer;
        }

        .track-item:hover {
            background: #25252b;
            transform: translateY(-2px);
            border-color: rgba(255, 71, 87, 0.2);
        }

        .track-item.active {
            border-color: var(--primary);
            background: rgba(255, 71, 87, 0.05);
        }

        .track-info-group { display: flex; align-items: center; gap: 15px; }
        .track-number { color: var(--primary); font-weight: 600; width: 25px; }
        .track-name { font-weight: 500; }

        .delete-btn {
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 1.5rem;
            cursor: pointer;
            transition: var(--transition);
            padding: 0 10px;
        }

        .delete-btn:hover { color: var(--primary); }

        /* --- Sidebar --- */
        .sidebar {
            width: 350px;
            background: var(--sidebar-bg);
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 25px;
            border-left: 1px solid rgba(255, 255, 255, 0.05);
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
        }

        /* --- Vinyl Disk Animation --- */
        .disk-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 0 auto 20px;
        }

        .vinyl-disk {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle, #333 0%, #000 70%);
            border: 5px solid #222;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            animation: rotateDisk 5s linear infinite;
            animation-play-state: paused;
        }

        .vinyl-disk::before {
            content: '';
            position: absolute;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background-image: url('https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?q=80&w=500&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            z-index: 2;
            border: 2px solid #000;
        }

        .vinyl-disk::after {
            content: '';
            position: absolute;
            width: 15px;
            height: 15px;
            background: var(--bg);
            border-radius: 50%;
            z-index: 3;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.8);
        }

        .grooves {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: repeating-radial-gradient(
                circle,
                transparent 0,
                transparent 5px,
                rgba(255,255,255,0.03) 6px,
                transparent 7px
            );
        }

        .vinyl-disk.playing {
            animation-play-state: running;
        }

        @keyframes rotateDisk {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .upload-btn {
            background: var(--primary);
            color: white;
            padding: 15px;
            text-align: center;
            border-radius: 10px;
            cursor: pointer;
            display: block;
            font-weight: 600;
            transition: var(--transition);
            box-shadow: 0 4px 15px var(--primary-glow);
        }

        .upload-btn:hover { 
            transform: scale(1.02);
            filter: brightness(1.1);
        }

        input[type="file"] { display: none; }

        /* --- Visualizer --- */
        .visualizer-bars {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 4px;
            height: 60px;
            margin-top: 15px;
        }

        .bar {
            width: 6px;
            background: linear-gradient(to top, var(--primary), #ff6b81);
            height: 8px;
            border-radius: 3px;
            transition: height 0.2s ease;
        }
