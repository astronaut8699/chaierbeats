<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Timo's spelletjes website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: white;
            text-align: center;
            margin-top: 80px;
        }

        h1 {
            font-size: 2.5em;
            animation: fadeIn 1.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .container {
            margin-top: 40px;
            display: none; /* Verberg spelletjes totdat test & wachtwoord zijn goed */
        }

        .button {
            display: block; /* zorgt dat ze onder elkaar staan */
            width: 250px;
            margin: 15px auto;
            padding: 15px;
            font-size: 18px;
            color: white;
            background-color: #4CAF50;
            border-radius: 25px;
            text-decoration: none;
            transition: 0.3s;
        }

        .button:hover {
            background-color: #45a049;
            transform: scale(1.05);
        }

        .button:active {
            transform: scale(0.95);
        }

        #captcha-container, #password-container {
            margin-top: 50px;
        }

        input[type="text"], input[type="password"] {
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #ccc;
            width: 200px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            border: none;
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }
    </style>
</head>

<body>

    <h1>🎮 Timo's spelletjes website</h1>

    <!-- CAPTCHA -->
    <div id="captcha-container">
        <p>Beantwoord de vragen om te bewijzen dat je geen robot bent:</p>
        <p id="captcha-question"></p>
        <input type="text" id="captcha-answer" placeholder="Antwoord">
        <button onclick="checkCaptcha()">Verstuur</button>
        <p id="captcha-error" style="color:red;"></p>
    </div>

    <!-- Wachtwoord -->
    <div id="password-container" style="display:none;">
        <p>Voer het wachtwoord in om toegang te krijgen:</p>
        <input type="password" id="password-input" placeholder="Wachtwoord">
        <button onclick="checkPassword()">Verstuur</button>
        <p id="password-error" style="color:red;"></p>
    </div>

    <!-- Spelletjes -->
    <div class="container">
        <a href="stick_fighter.html" class="button">stick fighter</a>
        <a href="cookie_clicker.html" class="button">cookie clicker</a>
        <a href="drive_mad.html" class="button">drive mad</a>
        <a href="geometry_dash.html" class="button">geometry dash</a>
        <a href="chaiersbeats.html" class="button">chaiersbeats</a>
        <a href="beatcity.html" class="button">beat city</a>
        <a href="https://calcsolver.net/" class="button">more unblockd games</a>
    </div>

    <script>
        // Instelbaar wachtwoord
        const correctPassword = "Gele_Auto_2026!"; // <- Hier verander je het wachtwoord

        // **Superlastige CAPTCHA**
        const vragen = [
            { vraag: "Wat is 137 × 29 - 456 ?", antwoord: "3843" },
            { vraag: "Wat is 25² + 49 ?", antwoord: "674" },
            { vraag: "Los op: 15 × 8 + 64 ÷ 4", antwoord: "136" },
            { vraag: "Typ het woord 'javascript' achterstevoren", antwoord: "tpircsavaj" },
            { vraag: "Verwijder alle klinkers uit 'complexiteit'", antwoord: "cmplxkt" },
            { vraag: "Wat is de 5e letter van 'programmeren'?", antwoord: "r" },
            { vraag: "Wat is het volgende getal in de reeks: 2, 6, 12, 20, ?", antwoord: "30" },
            { vraag: "Welke letter hoort hier: A, C, F, J, ?", antwoord: "O" },
            { vraag: "Onthoud deze code: X7P4K9Q2 (je moet dit exact typen)", antwoord: "X7P4K9Q2" },
            { vraag: "Typ exact: IK BEN GEEN ROBOT", antwoord: "IK BEN GEEN ROBOT" }
        ];

        // Shuffle de vragen
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        const willekeurigeVragen = shuffle(vragen);
        let huidigeVraag = 0;

        function startTest() {
            document.getElementById("captcha-question").innerText =
                willekeurigeVragen[huidigeVraag].vraag;
        }

        function checkCaptcha() {
            const antwoord = document.getElementById("captcha-answer").value.trim();

            if (antwoord === willekeurigeVragen[huidigeVraag].antwoord) {
                huidigeVraag++;

                if (huidigeVraag >= willekeurigeVragen.length) {
                    document.getElementById("captcha-container").style.display = "none";
                    document.getElementById("password-container").style.display = "block";
                } else {
                    document.getElementById("captcha-answer").value = "";
                    document.getElementById("captcha-question").innerText =
                        willekeurigeVragen[huidigeVraag].vraag;
                }
            } else {
                alert("Fout antwoord! Je begint opnieuw.");
                huidigeVraag = 0;
                document.getElementById("captcha-answer").value = "";
                startTest();
            }
        }

        function checkPassword() {
            let input = document.getElementById("password-input").value;
            if (input === correctPassword) {
                document.getElementById("password-container").style.display = "none";
                document.querySelector(".container").style.display = "block";
            } else {
                document.getElementById("password-error").innerText = "Fout wachtwoord. Probeer opnieuw.";
            }
        }

        window.onload = startTest;
    </script>

</body>
</html>
